[project]
name = "bot-fx"
version = "0.1.0"
description = "Fetch the Bank of Thailand daily weighted-average interbank THB/USD rate into SQLite"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
bot-fx = "bot_fx.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot_fx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
